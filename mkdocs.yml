site_name: Voyager
site_url: https://dxworks.org/voyager/

repo_url: https://github.com/dxworks/voyager
repo_name: dxworks/voyager
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2021 Dxworks

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    # Toggle light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Toggle dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  logo: assets/icons/dxworks-white-square-thick.png

plugins:
  - search:
      prebuild_index: true
  # Fills {{ voyager_version }} in the docs from extra below
  - markdownextradata

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 10
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

extra_css:
  - stylesheets/dxworks-theme.css

extra:
  generator: false
  # The one place to change the Voyager version used in all download links
  voyager_version: 1.6.3

use_directory_urls: false

nav:
#  - Home:
#      - 'index.md'
#      - Installing: 'installing.md'
#      - Configuration: 'configuration.md'
#      - Instruments: 'instruments.md'
#      - Runtimes: 'runtimes.md'
  - Quick Start: 'quickstart.md'
