name: Full Instrument Release

on:
  - workflow_dispatch
  - repository_dispatch

jobs:
  full-realease:
    name: Create Full Instruments Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Set variables
        id: set_variables
        run: |
          currentDate=$(date +"%Y-%m-%d")
          echo ::set-output name=currentDate::$currentDate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Setup Voyenv
        run: | 
          npm i -g @dxworks/voyenv
          voyenv -v

      - name: Prepare Voyager release
        run: |
          if [ -f "voyenv.yml" ]; then
            echo "Using existing voyenv.yml from repository root"
            mkdir -p release
            cp voyenv.yml release/
          else
            echo "No voyenv.yml found, initializing with voyenv"
            voyenv init -ci release
          fi
          cd release
          voyenv install
          zip -r voyager-full.zip voyager

      - id: latest_release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}

      - name: Upload New Release Asset
        run: |
          gh release upload ${{ steps.latest_release.outputs.release }} release/voyager-full.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Image version
        id: version
        run: |
          tag=${{ steps.latest_release.outputs.release }}
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker Image
    needs: full-realease
    # Only main publishes images; other branches just rebuild the bundle.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: dxworks/pipelines/.github/workflows/release-docker.yml@v1
    with:
      version: ${{ needs.full-realease.outputs.version }}
      image-name: dxworks/voyager
      build-script: ./scripts/docker-prepare.sh
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
