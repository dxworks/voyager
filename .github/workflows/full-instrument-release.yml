name: Full Instrument Release

on:
  - workflow_dispatch
  - repository_dispatch

jobs:
  full-realease:
    name: Create Full Instruments Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set variables
        id: set_variables
        run: |
          currentDate=$(date +"%Y-%m-%d")
          echo ::set-output name=currentDate::$currentDate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Setup Voyenv
        run: | 
          npm i -g @dxworks/voyenv
          voyenv -v

      - name: Prepare Voyager release
        run: |
          if [ -f "voyenv.yml" ]; then
            echo "Using existing voyenv.yml from repository root"
            mkdir -p release
            cp voyenv.yml release/
          else
            echo "No voyenv.yml found, initializing with voyenv"
            voyenv init -ci release
          fi
          cd release
          # voyenv fetches the engine only from a published release. When voyager_version names a
          # draft (V2 before it is published), voyenv installs the instruments with the newest
          # published engine, which is then replaced by the draft's engine zip (read with this
          # repo's token, which sees drafts). Nothing is published.
          engine=$(yq '.voyager_version' voyenv.yml)
          if [ "$(gh release view "$engine" --json isDraft -q .isDraft)" = "true" ]; then
            echo "Engine $engine is a draft: taking its $(yq '.voyager_asset // "dx-voyager.zip"' voyenv.yml) from the draft"
            published=$(gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName')
            yq -i ".voyager_version = \"$published\"" voyenv.yml
            voyenv install
            find voyager -mindepth 1 -maxdepth 1 ! -name instruments ! -name runtimes ! -name voyenv.yml -exec rm -rf {} +
            gh release download "$engine" -p "$(yq '.voyager_asset // "dx-voyager.zip"' voyenv.yml)" -O engine.zip
            unzip -q -o engine.zip -x 'voyager/instruments/*'   # as voyenv: the engine's demo instruments stay out
            rm engine.zip
            yq -i ".voyager_version = \"$engine\"" voyenv.yml
            yq -i ".voyager_version = \"$engine\"" voyager/voyenv.yml
          else
            voyenv install
          fi
          zip -r voyager-full.zip voyager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: target_release
        name: Read target release from voyenv.yml
        run: |
          release=$(yq '.full_release_tag // ""' release/voyenv.yml)
          if [ -z "$release" ]; then
            echo "voyenv.yml has no full_release_tag: using the latest Voyager release"
          fi
          echo "release=$release" >> $GITHUB_OUTPUT

      - id: latest_release
        if: steps.target_release.outputs.release == ''
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}

      - name: Upload New Release Asset
        run: |
          release="${{ steps.target_release.outputs.release || steps.latest_release.outputs.release }}"
          # A full_release_tag with no release yet gets a draft, on this branch's commit; never published here
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --draft --target "$GITHUB_SHA" --title "Voyager ${release#v}" --notes ""
          fi
          gh release upload "$release" release/voyager-full.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

