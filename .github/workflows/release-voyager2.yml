name: Create Voyager2 Release

on:
  pull_request:
    branches:
      - voyager2
  push:
    tags:
      - 'v2.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-v2:
    name: Build Voyager2 ${{ matrix.target.id }}
    runs-on: ${{ matrix.target.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: win-x64
            runs_on: windows-latest
            output_file: dx-voyager-win-x64.exe
          - id: linux-x64
            runs_on: ubuntu-latest
            output_file: dx-voyager-linux-x64
          - id: macos-x64
            runs_on: macos-15-intel
            output_file: dx-voyager-macos-x64
          - id: macos-arm64
            runs_on: macos-15
            output_file: dx-voyager-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dxworks'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fill Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # Voyager2's version, from the release tag
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '!/^program\.version\(/ {print} /^program\.version\(/ {print "program.version(\"" v "\")"}' src/voyager.ts > src/voyager.ts.tmp
          mv src/voyager.ts.tmp src/voyager.ts

      - name: Build SEA binary
        run: npm run build:sea

      - name: Verify binary exists
        run: |
          node -e "require('node:fs').accessSync('dist/sea/${{ matrix.target.output_file }}')"

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --sign - --force dist/sea/${{ matrix.target.output_file }}

      - name: Upload SEA binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyager2-${{ matrix.target.id }}
          path: dist/sea/${{ matrix.target.output_file }}
          retention-days: 1

  package:
    name: Package Voyager2
    runs-on: ubuntu-latest
    needs: build-v2
    permissions:
      contents: write
      actions: write
    env:
      # V1, packed with V2 as its fallback
      V1_VERSION: v1.6.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Voyager1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$V1_VERSION" -R dxworks/voyager -p dx-voyager.zip -D v1

      - name: Download Voyager2 binaries
        uses: actions/download-artifact@v4
        with:
          pattern: voyager2-*
          path: artifacts
          merge-multiple: true

      - name: Prepare Voyager2 release
        run: |
          # The engine zip only (V2, the launchers, V1); the Full Instrument Release adds the instruments
          mkdir -p release
          cd release
          unzip -q ../v1/dx-voyager.zip
          cp ../voyager.sh voyager/voyager.sh
          cp ../voyager.bat voyager/voyager.bat
          # Our .config.yml, .doctor.yml and mission.yml replace V1's (doctor minimums of today's instruments)
          cp ../.config.yml ../.doctor.yml ../mission.yml voyager/
          cp ../artifacts/dx-voyager-win-x64.exe voyager/
          cp ../artifacts/dx-voyager-linux-x64 voyager/
          cp ../artifacts/dx-voyager-macos-x64 voyager/
          cp ../artifacts/dx-voyager-macos-arm64 voyager/
          chmod +x voyager/voyager.sh
          chmod +x voyager/dx-voyager-linux-x64
          chmod +x voyager/dx-voyager-macos-x64
          chmod +x voyager/dx-voyager-macos-arm64
          zip -r dx-voyager.zip voyager

      - name: Upload Voyager2 package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dx-voyager
          path: release/dx-voyager.zip

      - name: Delete older packages of this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          # Keep only the newest PR build: remove the package zips of this PR's earlier runs
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=dx-voyager" \
            -q '.artifacts[] | select(.workflow_run.head_branch == env.PR_BRANCH and .workflow_run.id < (env.GITHUB_RUN_ID | tonumber)) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done

      - name: Extract Semver
        if: startsWith(github.ref, 'refs/tags/')
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: Voyager ${{ steps.semver_parser.outputs.semver }}
        run: |
          # Always a draft on the tagged commit; a re-run of the tag replaces the zip in that same draft
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published; it is left unchanged"
              exit 1
            fi
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$NAME"
            gh release upload "$TAG" release/dx-voyager.zip --clobber
          else
            gh release create "$TAG" release/dx-voyager.zip --draft --target "$GITHUB_SHA" --title "$NAME" --notes ""
          fi
